limit_req_zone $binary_remote_addr zone=sumora_runs:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=sumora_import:10m rate=5r/m;

server {
    listen 80 default_server;
    server_name _;
    root /opt/sumora/current/ui/dist;
    index index.html;

    location ~ ^/api/cases/[^/]+/(runs|investigate)$ {
        limit_req zone=sumora_runs burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /api/import {
        limit_req zone=sumora_import burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
